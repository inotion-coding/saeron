name: Deploy to GitHub Pages

# main에 push될 때마다 정적 빌드 후 깃허브 페이지로 배포.
# (저장소 Settings → Pages → Source = "GitHub Actions"로 설정해야 동작)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site (next export → out/)
        run: npm run build
        # 강사 페이지가 빌드 시 Supabase를 읽으므로 공개 키 주입.
        # NEXT_PUBLIC_* 는 공개용(클라 번들에 노출)이며 접근제어는 Supabase RLS가 담당.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://cmustyrzeosffhcijubt.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_WHeTKTUgTyNAXlUIIQiB7w_jWQEzJif

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
